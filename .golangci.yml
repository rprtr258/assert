version: "2"
run:
  tests: true
issues:
  max-same-issues: 0
linters:
  default: all
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - clickhouselint
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funcorder
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - goconst
    - gocritic
    - godoclint
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - gomodguard_v2
    - goprintffuncname
    - gosec
    # - gosimple
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    # - stylecheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    # - zerologlint
  disable:
    - cyclop
    - depguard
    - exhaustruct
    - exhaustruct_v5
    - funlen
    - gochecknoglobals # why the fuck i am not allowed to use globals
    - gocognit
    - gocyclo
    - godot # comments should not end in period
    - godox # TODO: remove
    - gomodguard # replaced by gomodguard_v2
    - gosmopolitan
    - ireturn # cool banner + hates generics
    - mnd # no magic here
    - nlreturn # too strict
    - noinlineerr # i want to control this shit at least with inline if
    - nonamedreturns # no
    - testpackage # too strict, disallows testing private symbols
    - varnamelen # makes bad suggestions
    - wsl # replaced by wsl_v5
    # TODO: remove
    - paralleltest
    - revive
    - tparallel
    - unused
  settings:
    gocritic:
      disabled-checks:
        - whyNoLint
      enabled-tags:
        - diagnostic
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 10
    exhaustive:
      default-signifies-exhaustive: true
    goconst:
      ignore-tests: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - revive
        path: power_assert_private.go
      - linters:
          - gocritic
          - staticcheck
        path: power_assert_test.go
      - linters:
          - funlen
          - lll
        path: internal/q/q_test.go
      - linters:
          - mnd
        path: internal/q/cmd/main.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
